version: '3.8'

# Nom de projet Docker : prefixe les volumes/reseau (frugalai_n8n_data, frugalai_default).
name: frugalai

services:

  # ── IA Frugaliste : orchestration n8n ───────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: frugalai-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Europe/Paris
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-frugalai-secret-key-change-in-production}
      - N8N_BASIC_AUTH_ACTIVE=false
      - EXECUTIONS_PROCESS=main
      - N8N_LOG_LEVEL=info
      - SUPABASE_URL=http://host.docker.internal:8000
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - OLLAMA_URL=http://frugalai-ollama:11434
      - OCR_URL=http://frugalai-ocr:3100
      - FRUGALISTE_MODEL=${FRUGALISTE_MODEL:-mistral}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./pdfs:/data/pdfs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - ocr

  # ── Service OCR (PDFs scannés + extraction texte + métadonnées) ─────────────
  ocr:
    build: ./ocr
    container_name: frugalai-ocr
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./pdfs:/data/pdfs:ro
      - ./ocr_cache:/data/cache
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3100/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Modèles LLM locaux ──────────────────────────────────────────────────────
  # OLLAMA_DATA_PATH dans .env : pointe vers ~/.ollama si les modèles existent déjà
  # Laisser vide sur un nouveau PC → Docker crée un volume dédié (puis lancer setup.ps1)
  ollama:
    image: ollama/ollama:latest
    container_name: frugalai-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      # 2 modeles residents max : permet de garder Mistral (frugaliste) + nomic (embed)
      # charges en meme temps -> supprime les rechargements disque a chaque tour.
      # Ollama respecte quand meme la RAM dispo : si 2 gros modeles ne tiennent pas,
      # il decharge tout seul (pas de regression OOM).
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_NUM_PARALLEL=1
      # Garde les modeles charges 30 min apres usage (zero rechargement pendant un debat)
      - OLLAMA_KEEP_ALIVE=30m
    # NOTE GPU : ce PC a un GPU NVIDIA mais WSL2 ne le voit pas ("no adapters found").
    # Pour activer le GPU (gain ~10-50x) : mettre a jour le pilote NVIDIA Windows (support
    # CUDA-on-WSL), puis re-ajouter ici un bloc:
    #   deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: all, capabilities: [gpu] }] } } }
    volumes:
      - ${OLLAMA_DATA_PATH:-ollama_models}:/root/.ollama

volumes:
  # Volume existant des donnees n8n (workflows + patches), conserve entre redemarrages.
  n8n_data:
    external: true
    name: frugalai_n8n_data
  ollama_models:
